<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mein Training</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#10141d;color:#f2f4f8}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:22px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0 0 8px}p{color:#abb5c6;line-height:1.5}.muted,small{color:#9da9bb}.card{background:#1c2432;border:1px solid #344053;border-radius:16px;padding:17px;margin-bottom:14px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:112px;text-align:left;font-size:20px;font-weight:750;background:#1c2432;border:1px solid #344053;border-radius:17px;padding:17px;color:#fff;cursor:pointer}.tile span{display:block;font-size:12px;font-weight:400;color:#a6b1c2;margin-top:9px}button{cursor:pointer;border:0;border-radius:11px;background:#6b93fa;color:#08101f;padding:12px 15px;font-size:15px;font-weight:700}button.secondary{background:#303d51;color:#f3f6ff}button.danger{background:#5d3039;color:#fff}button.ghost{background:transparent;color:#b9caff;padding:8px}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #455268;background:#121a26;color:#fff;border-radius:10px;padding:11px;font-size:16px;min-width:0}label{font-size:13px;color:#b8c4d6;display:block;margin-bottom:5px}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}.between{justify-content:space-between}.grow{flex:1}.stack{display:grid;gap:10px}.sets{display:grid;grid-template-columns:35px 1fr 1fr;gap:9px;align-items:start}.setnum{padding-top:12px}.hint{font-size:12px;color:#aebbd0;margin-top:4px}.notice{border-left:3px solid #7fa2ff;padding:10px 13px;background:#26344a;border-radius:6px;margin:12px 0;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1}.hidden{display:none!important}.section{margin-top:20px}.pill{font-size:12px;border-radius:30px;padding:5px 9px;background:#31405a;color:#cdd9ed}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 5px;border-bottom:1px solid #364155;text-align:left}th{color:#b9c4d5;font-weight:600}.chart{width:100%;height:auto;display:block}.legend{font-size:12px;color:#aab8c9}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.listrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #334054}.listrow .grow{overflow-wrap:anywhere}details{border-bottom:1px solid #344053;padding:12px 0}summary{cursor:pointer;font-weight:650}footer{margin-top:30px;color:#9ba8ba;font-size:12px;line-height:1.5}@media(min-width:600px){.tile{min-height:135px}} 
</style></head><body><main><header><h1 id="heading">Mein Training</h1><button class="secondary hidden" id="back" onclick="goHome()">← Start</button></header><div id="app"></div><footer>Deine Daten bleiben auf diesem Gerät in diesem Browser. Sichere sie regelmäßig unter Statistiken → Datensicherung. Beim Löschen der Browserdaten können sie verloren gehen.</footer></main><script>
'use strict';
const KEY='training-app-v1';
const initial={exercises:[
...['Brustpresse','Schrägbank Kurzhanteln','Schulterdrücken','Seitheben','Trizeps am Kabel','Überkopf-Trizeps'].map((name,i)=>({id:'p'+i,group:'Push',name,sets:3,active:true,order:i})),
...['Klimmzüge','Latzug','Rudern sitzend eng','Brustgestütztes Rudern','Reverse Flys','Bizepscurls','Hammercurls'].map((name,i)=>({id:'u'+i,group:'Pull',name,sets:3,active:true,order:i})),
...['Kniebeugen / Beinpresse','Rumänisches Kreuzheben','Beinbeuger','Beinstrecker','Wadenheben','Bauch'].map((name,i)=>({id:'l'+i,group:'Beine',name,sets:3,active:true,order:i}))],sessions:[],weights:[],draft:null};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.exercises)&&Array.isArray(s.sessions)&&Array.isArray(s.weights)?s:structuredClone(initial)}catch{return structuredClone(initial)}}
let db=load(),view='home',group='Push',exerciseId='',statsTab='weight',statExercise='',editGroup='Push';
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const nice=d=>d?d.split('-').reverse().join('.'):'–';
const num=x=>Number(String(x).replace(',','.'));
const fmt=x=>Number(x).toLocaleString('de-DE',{maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function active(g){return db.exercises.filter(x=>x.active&&x.group===g).sort((a,b)=>a.order-b.order)}
function getEx(id){return db.exercises.find(x=>x.id===id)}
function sessionsFor(id){return db.sessions.filter(s=>s.entries.some(e=>e.exerciseId===id&&e.sets.length)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function lastEntry(id){const s=sessionsFor(id)[0];return s?.entries.find(e=>e.exerciseId===id&&e.sets.length)}
function pendingNote(id){const entries=db.sessions.filter(s=>s.entries.some(e=>e.exerciseId===id&&e.sets.length)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let note='';for(const s of entries){const e=s.entries.find(e=>e.exerciseId===id&&e.sets.length);note=e.note||''}return note}
function shell(title,html){$('heading').textContent=title;$('back').classList.toggle('hidden',view==='home');$('app').innerHTML=html}
function goHome(){view='home';render()}
function render(){if(view==='home')home();else if(view==='train')train();else if(view==='stats')stats();else if(view==='plan')plan()}
function home(){shell('Mein Training',`<p>Wähle deinen Trainingsbereich.</p><div class="tiles">${['Push','Pull','Beine'].map(g=>`<button class="tile" onclick="start('${g}')">${g}<span>${active(g).length} Übungen</span></button>`).join('')}<button class="tile" onclick="openStats()">Statistiken<span>Gewicht, Kraft & Verlauf</span></button></div>${db.draft?`<div class="card section"><h3>Offenes Training</h3><p>${esc(db.draft.group)} · ${nice(db.draft.date)}</p><button onclick="resume()">Training fortsetzen</button> <button class="danger" onclick="discard()">Verwerfen</button></div>`:''}`)}
function start(g){if(db.draft){if(db.draft.group===g){resume();return}alert('Bitte zuerst das offene Training abschließen oder verwerfen.');return}db.draft={id:String(Date.now()),date:dateKey(),group:g,entries:{}};group=g;exerciseId=active(g)[0]?.id||'';save();view='train';render()}
function resume(){group=db.draft.group;exerciseId=exerciseId&&active(group).some(x=>x.id===exerciseId)?exerciseId:active(group)[0]?.id||'';view='train';render()}
function discard(){if(confirm('Offenes Training wirklich verwerfen?')){db.draft=null;save();goHome()}}
function entryFor(id){const d=db.draft.entries;if(!d[id]){const prev=lastEntry(id),n=getEx(id)?.sets||3;d[id]={weights:Array.from({length:n},(_,i)=>prev?.sets[i]?.weight??prev?.sets.at(-1)?.weight??''),reps:Array(n).fill(''),note:'',noteEdited:false};save()}return d[id]}
function changeExercise(id){exerciseId=id;render()}
function train(){if(!db.draft){goHome();return}const list=active(group);if(!list.length){shell(group,`<div class="card">Keine Übungen vorhanden. Bitte zuerst im Trainingsplan Übungen anlegen.</div><button onclick="openStats();statsTab='plan';render()">Zum Trainingsplan</button>`);return}if(!list.some(x=>x.id===exerciseId))exerciseId=list[0].id;const ex=getEx(exerciseId),en=entryFor(ex.id),last=lastEntry(ex.id),note=pendingNote(ex.id);shell(group+'-Training',`<div class="row between"><span class="pill">Begonnen am ${nice(db.draft.date)}</span><span class="muted">${list.findIndex(x=>x.id===ex.id)+1} / ${list.length}</span></div><div class="card section"><label for="jump">Übung auswählen</label><select id="jump" onchange="changeExercise(this.value)">${list.map(x=>`<option value="${esc(x.id)}" ${x.id===ex.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><h2 class="section">${esc(ex.name)}</h2>${last?`<p>Zuletzt: ${last.sets.map(s=>`${fmt(s.weight)} kg × ${s.reps}`).join(' · ')}</p>`:'<p>Noch kein vorheriges Training dieser Übung.</p>'}${note?`<div class="notice"><b>Notiz vom letzten Training:</b>\n${esc(note)}</div>`:''}<div class="sets"><label>Satz</label><label>Gewicht (kg)</label><label>Wiederholungen</label>${en.reps.map((r,i)=>`<div class="setnum">${i+1}.</div><div><input aria-label="Gewicht Satz ${i+1}" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(en.weights[i])}" oninput="setField('weights',${i},this.value)"></div><div><input aria-label="Wiederholungen Satz ${i+1}" type="number" inputmode="numeric" min="0" step="1" placeholder="–" value="${esc(r)}" oninput="setField('reps',${i},this.value)"><div class="hint">Zuletzt: ${last?.sets[i]?.reps??'–'}</div></div>`).join('')}</div><div class="section"><button class="secondary" onclick="toggleNote()">+ Notiz ${en.note?'(vorhanden)':''}</button><div id="noteArea" class="${window.noteOpen?'':'hidden'} section"><label>Notiz für das nächste Training dieser Übung</label><textarea rows="3" oninput="setNote(this.value)">${esc(en.note)}</textarea><p class="hint">Wird nur beim nächsten tatsächlich absolvierten Training dieser Übung angezeigt.</p></div></div><div class="actions"><button class="secondary" onclick="prevExercise()">← Vorherige</button><button onclick="nextExercise()">Nächste →</button></div></div><div class="actions"><button class="secondary" onclick="goHome()">Später fortsetzen</button><button onclick="finish()">Training abschließen</button></div>`)}
function setField(key,i,value){db.draft.entries[exerciseId][key][i]=value;save()}
function setNote(value){const e=db.draft.entries[exerciseId];e.note=value;e.noteEdited=true;save()}
function toggleNote(){window.noteOpen=!window.noteOpen;$('noteArea').classList.toggle('hidden',!window.noteOpen)}
function nextExercise(){const a=active(group),i=a.findIndex(x=>x.id===exerciseId);exerciseId=a[Math.min(i+1,a.length-1)].id;window.noteOpen=false;render()}
function prevExercise(){const a=active(group),i=a.findIndex(x=>x.id===exerciseId);exerciseId=a[Math.max(i-1,0)].id;window.noteOpen=false;render()}
function finish(){const d=db.draft,entries=[];for(const [id,e] of Object.entries(d.entries)){const sets=[];for(let i=0;i<e.reps.length;i++){if(String(e.reps[i]).trim()==='')continue;const r=num(e.reps[i]),w=num(e.weights[i]);if(!Number.isInteger(r)||r<=0||!Number.isFinite(w)||w<0||String(e.weights[i]).trim()===''){alert('Bitte gültiges Gewicht und positive Wiederholungen für alle ausgefüllten Sätze eintragen.');return}sets.push({weight:w,reps:r})}if(sets.length)entries.push({exerciseId:id,sets,note:e.note.trim()})}if(!entries.length){alert('Bitte mindestens einen absolvierten Satz eintragen.');return}if(!confirm(`${entries.length} absolvierte Übung(en) vom ${nice(d.date)} speichern?`))return;db.sessions.push({id:d.id,date:d.date,group:d.group,entries});db.draft=null;save();window.noteOpen=false;openStats('history')}
function openStats(tab='weight'){view='stats';statsTab=tab;render()}
function tabs(){return `<div class="actions">${[['weight','Körpergewicht'],['strength','Kraft'],['history','Historie'],['frequency','Häufigkeit'],['plan','Trainingsplan'],['backup','Datensicherung']].map(([id,name])=>`<button class="${statsTab===id?'':'secondary'}" onclick="statsTab='${id}';render()">${name}</button>`).join('')}</div>`}
function stats(){let html=tabs();if(statsTab==='weight')html+=weightView();if(statsTab==='strength')html+=strengthView();if(statsTab==='history')html+=historyView();if(statsTab==='frequency')html+=frequencyView();if(statsTab==='plan')html+=`<div class="card section"><h2>Trainingsplan verwalten</h2><p>Übungen hinzufügen, ersetzen, entfernen und sortieren. Historische Daten bleiben erhalten.</p><button onclick="view='plan';render()">Trainingsplan öffnen</button></div>`;if(statsTab==='backup')html+=backupView();shell('Statistiken',html)}
function weekStart(d){const x=new Date(d+'T12:00:00'),wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dateKey(x)}
function weekly(){const map={};for(const w of db.weights){const k=weekStart(w.date);(map[k]??=[]).push(w.value)}return Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).map(([date,values])=>({date,avg:values.reduce((a,b)=>a+b,0)/values.length,count:values.length}))}
function weightView(){const weeks=weekly(),recent=weeks.slice(-12),today=db.weights.find(w=>w.date===dateKey());return `<div class="card section"><h2>Körpergewicht erfassen</h2><div class="row"><div class="grow"><label>Datum</label><input id="weightDate" type="date" value="${dateKey()}"></div><div class="grow"><label>Gewicht (kg)</label><input id="weightValue" type="number" min="1" step="0.1" inputmode="decimal" value="${today?.value??''}" placeholder="z. B. 79,2"></div></div><div class="actions"><button onclick="addWeight()">Gewicht speichern</button></div></div><div class="card"><h2>Wochendurchschnitt</h2>${lineChart(recent.map(x=>({date:nice(x.date),value:x.avg})),'kg')}<table><thead><tr><th>Woche ab</th><th>Ø Gewicht</th><th>Messungen</th></tr></thead><tbody>${weeks.slice().reverse().map(x=>`<tr><td>${nice(x.date)}</td><td>${fmt(x.avg)} kg</td><td>${x.count} von 7</td></tr>`).join('')||'<tr><td colspan="3">Noch keine Daten</td></tr>'}</tbody></table></div><div class="card"><h2>Einzelmessungen</h2><table>${db.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,35).map(w=>`<tr><td>${nice(w.date)}</td><td>${fmt(w.value)} kg</td><td><button class="ghost" onclick="deleteWeight('${w.date}')">Löschen</button></td></tr>`).join('')||'<tr><td>Keine Messungen vorhanden</td></tr>'}</table></div>`}
function addWeight(){const d=$('weightDate').value,v=num($('weightValue').value);if(!/^\d{4}-\d\d-\d\d$/.test(d)||!Number.isFinite(v)||v<=0||v>500){alert('Bitte gültiges Datum und Gewicht eingeben.');return}db.weights=db.weights.filter(x=>x.date!==d);db.weights.push({date:d,value:v});save();render()}
function deleteWeight(d){if(confirm('Gewichtseintrag löschen?')){db.weights=db.weights.filter(x=>x.date!==d);save();render()}}
function exerciseSelector(){const all=db.exercises.filter(x=>sessionsFor(x.id).length||x.active);if(!statExercise||!all.some(x=>x.id===statExercise))statExercise=all[0]?.id||'';return `<label>Übung auswählen</label><select onchange="statExercise=this.value;render()">${all.map(x=>`<option value="${esc(x.id)}" ${x.id===statExercise?'selected':''}>${esc(x.group)} · ${esc(x.name)}${x.active?'':' (archiviert)'}</option>`).join('')}</select>`}
function exerciseRows(){return sessionsFor(statExercise).map(s=>{const e=s.entries.find(x=>x.exerciseId===statExercise);return {date:s.date,sets:e.sets,weight:e.sets[0].weight,reps:e.sets.reduce((a,x)=>a+x.reps,0),volume:e.sets.reduce((a,x)=>a+x.weight*x.reps,0),note:e.note}}).reverse()}
function strengthView(){const rows=exerciseRows();return `<div class="card section"><h2>Gewicht & Wiederholungen</h2>${exerciseSelector()}<p class="legend"><span class="swatch" style="background:#7ca8ff"></span>Gewicht (kg) · linke Achse &nbsp; <span class="swatch" style="background:#f4b266"></span>Wiederholungen gesamt · rechte Achse</p>${dualChart(rows)}<p class="muted">Je Einheit wird das Gewicht des ersten absolvierten Satzes und die Summe aller Wiederholungen angezeigt. Unterschiedliche Satzgewichte bleiben in der Historie nachvollziehbar.</p></div>`}
function historyView(){const rows=exerciseRows().reverse();return `<div class="card section"><h2>Satzhistorie</h2>${exerciseSelector()}${rows.map(r=>`<details><summary>${nice(r.date)} · ${r.reps} Wdh. · ${fmt(r.volume)} kg Volumen</summary><table><thead><tr><th>Satz</th><th>Gewicht</th><th>Wdh.</th></tr></thead><tbody>${r.sets.map((s,i)=>`<tr><td>${i+1}</td><td>${fmt(s.weight)} kg</td><td>${s.reps}</td></tr>`).join('')}</tbody></table>${r.note?`<p>Notiz: ${esc(r.note)}</p>`:''}</details>`).join('')||'<p>Noch keine Trainingsdaten zu dieser Übung.</p>'}</div>`}
function frequencyView(){const map={};for(const s of db.sessions){const k=weekStart(s.date);map[k]??={Push:0,Pull:0,Beine:0};map[k][s.group]++}return `<div class="card section"><h2>Trainingshäufigkeit</h2><table><thead><tr><th>Woche ab</th><th>Push</th><th>Pull</th><th>Beine</th><th>Gesamt</th></tr></thead><tbody>${Object.entries(map).sort(([a],[b])=>b.localeCompare(a)).map(([k,v])=>`<tr><td>${nice(k)}</td><td>${v.Push}</td><td>${v.Pull}</td><td>${v.Beine}</td><td>${v.Push+v.Pull+v.Beine}</td></tr>`).join('')||'<tr><td colspan="5">Noch keine Trainingsdaten</td></tr>'}</tbody></table></div>`}
function lineChart(rows,unit){if(!rows.length)return '<p>Noch keine Daten vorhanden.</p>';const w=360,h=190,l=42,r=12,t=18,b=34,vals=rows.map(x=>x.value),lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5),range=Math.max(1,hi-lo),x=i=>l+i*(w-l-r)/Math.max(1,rows.length-1),y=v=>t+(hi-v)/range*(h-t-b);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gewichtsverlauf">${[0,.5,1].map(p=>`<line x1="${l}" x2="${w-r}" y1="${t+p*(h-t-b)}" y2="${t+p*(h-t-b)}" stroke="#435066"/><text x="3" y="${t+p*(h-t-b)+4}" fill="#c2cede" font-size="11">${fmt(hi-p*range)}</text>`).join('')}<polyline fill="none" stroke="#7ca8ff" stroke-width="3" points="${rows.map((v,i)=>`${x(i)},${y(v.value)}`).join(' ')}"/>${rows.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.value)}" r="3.5" fill="#7ca8ff"><title>${v.date}: ${fmt(v.value)} ${unit}</title></circle>`).join('')}<text x="${l}" y="${h-6}" fill="#c2cede" font-size="11">${esc(rows[0].date)}</text><text x="${w-r}" y="${h-6}" text-anchor="end" fill="#c2cede" font-size="11">${esc(rows.at(-1).date)}</text></svg>`}
function dualChart(rows){if(!rows.length)return '<p>Noch keine Daten vorhanden.</p>';const w=360,h=210,l=44,r=43,t=22,b=40,gh=h-t-b,gw=w-l-r;const maxW=Math.max(1,...rows.map(v=>v.weight)),maxR=Math.max(1,...rows.map(v=>v.reps)),x=i=>l+i*gw/Math.max(1,rows.length-1),yw=v=>t+gh*(1-v/maxW),yr=v=>t+gh*(1-v/maxR);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trainingsgewicht links und Wiederholungen rechts nach Datum">${[0,.5,1].map(p=>`<line x1="${l}" x2="${w-r}" y1="${t+p*gh}" y2="${t+p*gh}" stroke="#435066"/><text x="${l-5}" y="${t+p*gh+4}" fill="#7ca8ff" text-anchor="end" font-size="11">${fmt(maxW*(1-p))}</text><text x="${w-r+5}" y="${t+p*gh+4}" fill="#f4b266" font-size="11">${fmt(maxR*(1-p))}</text>`).join('')}<polyline fill="none" stroke="#7ca8ff" stroke-width="2.5" points="${rows.map((v,i)=>`${x(i)},${yw(v.weight)}`).join(' ')}"/><polyline fill="none" stroke="#f4b266" stroke-width="2.5" points="${rows.map((v,i)=>`${x(i)},${yr(v.reps)}`).join(' ')}"/>${rows.map((v,i)=>`<circle cx="${x(i)}" cy="${yw(v.weight)}" r="3" fill="#7ca8ff"><title>${nice(v.date)}: ${fmt(v.weight)} kg</title></circle><circle cx="${x(i)}" cy="${yr(v.reps)}" r="3" fill="#f4b266"><title>${nice(v.date)}: ${v.reps} Wiederholungen</title></circle>`).join('')}<text x="${l}" y="${h-9}" fill="#c2cede" font-size="11">${nice(rows[0].date)}</text><text x="${w-r}" y="${h-9}" text-anchor="end" fill="#c2cede" font-size="11">${nice(rows.at(-1).date)}</text></svg>`}
function plan(){const a=active(editGroup);shell('Trainingsplan',`<div class="row" style="margin-bottom:16px">${['Push','Pull','Beine'].map(g=>`<button class="${g===editGroup?'':'secondary'} grow" onclick="editGroup='${g}';render()">${g}</button>`).join('')}</div><div class="card"><h2>${editGroup} · Übungen</h2>${a.map((x,i)=>`<div class="listrow"><span class="muted">${i+1}.</span><span class="grow">${esc(x.name)} <small>(${x.sets} Sätze)</small></span><button class="ghost" onclick="moveEx('${x.id}',-1)" aria-label="Nach oben">↑</button><button class="ghost" onclick="moveEx('${x.id}',1)" aria-label="Nach unten">↓</button><button class="ghost" onclick="editEx('${x.id}')">✎</button><button class="ghost" onclick="removeEx('${x.id}')">×</button></div>`).join('')||'<p>Noch keine Übungen.</p>'}<div class="actions"><button onclick="addEx()">+ Übung hinzufügen</button></div></div><button class="secondary" onclick="openStats('plan')">← Zur Statistik</button>`)}
function addEx(){const name=prompt('Name der neuen Übung:');if(!name?.trim())return;const sets=prompt('Anzahl Sätze:', '3');if(sets===null)return;const n=Number(sets);if(!Number.isInteger(n)||n<1||n>12){alert('Bitte 1 bis 12 Sätze wählen.');return}db.exercises.push({id:'ex'+Date.now(),group:editGroup,name:name.trim(),sets:n,active:true,order:active(editGroup).length});save();render()}
function editEx(id){const x=getEx(id),name=prompt('Übung umbenennen (Historie bleibt erhalten):',x.name);if(name===null||!name.trim())return;const sets=prompt('Anzahl geplanter Sätze:',x.sets);if(sets===null)return;const n=Number(sets);if(!Number.isInteger(n)||n<1||n>12){alert('Bitte 1 bis 12 Sätze wählen.');return}x.name=name.trim();x.sets=n;save();render()}
function removeEx(id){if(db.draft){alert('Bitte zuerst das offene Training abschließen.');return}if(!confirm('Übung aus dem Plan entfernen? Die Historie bleibt erhalten.'))return;getEx(id).active=false;save();render()}
function moveEx(id,dir){if(db.draft){alert('Bitte zuerst das offene Training abschließen.');return}const a=active(editGroup),i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;const o=a[i].order;a[i].order=a[j].order;a[j].order=o;save();render()}
function backupView(){return `<div class="card section"><h2>Datensicherung</h2><p>Exportiere deine Trainingsdaten regelmäßig als JSON-Datei. Beim Import wird der aktuelle Datenstand vollständig ersetzt.</p><div class="actions"><button onclick="exportData()">Backup herunterladen</button><label style="flex:1"><span class="hidden">Backup auswählen</span><input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></label></div><p class="hint">Aktuell: ${db.sessions.length} Trainingseinheiten und ${db.weights.length} Gewichtsmessungen gespeichert.</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='training-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){if(!file)return;try{const s=JSON.parse(await file.text());if(!Array.isArray(s.exercises)||!Array.isArray(s.sessions)||!Array.isArray(s.weights)||s.exercises.some(e=>!e.id||!e.group||!e.name)||s.sessions.some(e=>!Array.isArray(e.entries))){throw Error('Ungültiges Backupformat')}if(!confirm('Alle aktuellen Daten durch das Backup ersetzen? Bitte vorher exportieren.'))return;db={exercises:s.exercises,sessions:s.sessions,weights:s.weights,draft:s.draft||null};save();statExercise='';alert('Backup importiert.');render()}catch(e){alert('Import fehlgeschlagen: '+e.message)}}
render();
</script></body></html>
